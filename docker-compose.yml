# This file is responsible for seetings of my docker

services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: app # local passowrd, safe to commit
      POSTGRES_DB: linkedlead
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: